name: API Probe (einmalig)

# Abendprobe 04./05.10.2026: Stundentabelle um 23:50 und 00:10 Berlin abrufen
# (Tag vollstaendig? Reset um Mitternacht?). Mehrere Cron-Chancen, weil GitHub den
# Cron um Stunden verschieben kann; der Lauf wartet intern auf die Zielzeiten.
# Wird nach der Auswertung wieder entfernt.

on:
  schedule:
    - cron: "0 18,19,20 * * *"   # 20/21/22 Uhr Berlin (Sommerzeit)
  workflow_dispatch:

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Probe 23:50 und 00:10
        env:
          FIREBASE_API_KEY:       ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_REFRESH_TOKEN: ${{ secrets.FIREBASE_REFRESH_TOKEN }}
        run: |
          wait_until() {  # $1 = HH:MM Berlin, naechstes Vorkommen innerhalb 6 h
            T=$(TZ=Europe/Berlin date -d "$1" +%s); NOW=$(date +%s)
            [ "$T" -lt "$((NOW - 3600))" ] && T=$((T + 86400))
            if [ "$T" -gt "$NOW" ]; then echo "warte bis $1 Berlin"; sleep $((T - NOW)); fi
          }
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$(TZ=Europe/Berlin date +%H)" -lt 12 ]; then
              python probe_utilization.py          # Cron verspaetet nach Mitternacht
            else
              wait_until 23:50; python probe_utilization.py
              wait_until 00:10; python probe_utilization.py
            fi
          else
            python probe_utilization.py
          fi
