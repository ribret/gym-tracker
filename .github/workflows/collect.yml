name: Gym Utilization Tracker

# TAKTUNG (seit 03.10.2026):
#   Charlottenburg (Fokus) jede Messrunde, Rundentakt 20 Min -> >= 2x pro Stunde, 24/7.
#   Die uebrigen 6 Studios ~3x taeglich (~08/13/18 Uhr); Auswahl in gym_tracker.py
#   (due_studios: letzte Messung >= 5 h alt, 08-21 Uhr Berlin).
#
# WARUM EINE KETTE: GitHub feuert den schedule-Cron nur best effort, seit Mitte Sept
# 2026 nur noch 4-8x/Tag mit Abstaenden bis 7,3 h. Ein Job darf max. 6 h laufen, also
# reicht keine noch so lange Schleife fuer "2x pro Stunde". Deshalb startet jeder Lauf
# am Ende per workflow_dispatch den naechsten (GITHUB_TOKEN darf workflow_dispatch
# ausnahmsweise ausloesen). Der Cron bleibt Sicherheitsnetz: reisst die Kette, startet
# er sie neu. concurrency haelt immer genau einen Sampler aktiv + max. einen wartenden.
#
# KOSTEN: Repo ist PUBLIC -> Standard-Runner kostenlos ohne Minutenlimit. Muss public
# bleiben, sonst sprengt der Dauerbetrieb das 2000-Min-Kontingent privater Repos.
#
# STATUS:   gh run list --workflow=collect.yml --limit 10
# NOTAUS:   gh variable set COLLECT_CHAIN --body off   (Kette stoppt nach laufendem Job)
#           gh workflow disable collect.yml            (alles aus, inkl. Cron)
# WIEDER AN: gh variable delete COLLECT_CHAIN ; gh workflow run collect.yml

on:
  schedule:
    - cron: "*/30 * * * *"     # Sicherheitsnetz: (re)startet die Kette, falls sie reisst
  workflow_dispatch:
    inputs:
      samples:
        description: "Messrunden pro Lauf"
        default: "6"
      interval_seconds:
        description: "Sekunden zwischen Messrunden"
        default: "1200"
      chain:
        description: "Am Ende naechsten Lauf starten (true/false)"
        default: "true"

concurrency:
  group: gym-collect
  cancel-in-progress: false

jobs:
  collect:
    timeout-minutes: 150       # 6 Runden a 20 Min = 2 h inkl. Warten auf Folgetermin + Puffer
    runs-on: ubuntu-latest      # Standard-Runner = fuer Public-Repos kostenlos
    permissions:
      contents: write           # CSV committen
      actions: write            # naechsten Lauf per workflow_dispatch starten

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0          # voller Verlauf -> sauberer rebase im Loop

      - name: Python Setup
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Dependencies
        run: pip install requests

      - name: Sample loop
        env:
          FIREBASE_API_KEY:       ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_REFRESH_TOKEN: ${{ secrets.FIREBASE_REFRESH_TOKEN }}
          SAMPLES:          ${{ github.event.inputs.samples || '6' }}
          INTERVAL_SECONDS: ${{ github.event.inputs.interval_seconds || '1200' }}
          CHAIN: ${{ vars.COLLECT_CHAIN != 'off' && github.event.inputs.chain != 'false' }}
        run: |
          set -u
          git config user.name  "gym-tracker[bot]"
          git config user.email "gym-tracker@users.noreply.github.com"
          START=$(date +%s)

          for i in $(seq 1 "${SAMPLES}"); do
            echo "::group::Runde ${i}/${SAMPLES} ($(TZ='Europe/Berlin' date '+%H:%M:%S') Berlin)"

            # eine Messrunde (Studio-Auswahl in gym_tracker.py); Fehler killt den Lauf nicht
            python gym_tracker.py || echo "WARN: Runde ${i} fehlgeschlagen, weiter"

            git add --all data/
            if git diff --cached --quiet; then
              echo "keine neuen Daten"
            else
              git commit -q -m "data: $(date -u '+%Y-%m-%d %H:%M') UTC"
              pushed=0
              for try in 1 2 3; do
                if git pull -q --rebase --autostash origin main && git push -q origin main; then
                  pushed=1; break
                fi
                echo "push-Retry ${try}"; sleep 5
              done
              [ "${pushed}" = 1 ] || echo "WARN: push nach 3 Versuchen fehlgeschlagen"
            fi
            echo "::endgroup::"

            # driftfrei: bis zum festen Zeitpunkt START + i*INTERVAL schlafen. Nach der
            # LETZTEN Runde (nur bei aktiver Kette) bis ~90 s vor dem naechsten Termin,
            # damit die erste Runde des Nachfolgers im 20-Min-Takt liegt statt direkt
            # nach dieser (sonst Doppelmessung an jeder Lauf-Grenze, gesehen 03.10.).
            if [ "${i}" -lt "${SAMPLES}" ] || [ "${CHAIN}" = "true" ]; then
              NEXT=$(( START + i * INTERVAL_SECONDS ))
              [ "${i}" -eq "${SAMPLES}" ] && NEXT=$(( NEXT - 90 ))
              NOW=$(date +%s)
              if [ "${NEXT}" -gt "${NOW}" ]; then sleep $(( NEXT - NOW )); fi   # if-Form: Status 0 auch ohne Warten
            fi
          done

      - name: Next run (chain)
        if: ${{ !cancelled() && vars.COLLECT_CHAIN != 'off' && github.event.inputs.chain != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --ref main -R "${{ github.repository }}" && echo "naechster Lauf angestossen"
